version: '3.8'

services:
  db:
    image: postgres:15
    container_name: gestaoalunos-postgres
    environment:
      POSTGRES_DB: gestaoalunos_dev
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: gestao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: gestaoalunos-app
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gestaoalunos_dev
      SPRING_DATASOURCE_USERNAME: gestao
      SPRING_DATASOURCE_PASSWORD: gestao
      APP_JWT_SECRET: "uma-chave-secreta-bem-grande-e-dificil"
      APP_JWT_EXPIRATION: 3600000
    ports:
      - "8080:8080"

volumes:
  pgdata: